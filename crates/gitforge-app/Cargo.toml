[package]
name = "gitforge-app"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "gitforge"
path = "src/main.rs"

[package.metadata.deb]
name = "gitforge"
maintainer = "Jason <jason@gitforge.dev>"
copyright = "2025, Jason"
license-file = ["../../LICENSE", "0"]
depends = "libssl3, libfreetype6, libfontconfig1, libwayland-client0, libx11-6, libegl1, libvulkan1"
section = "devel"
priority = "optional"
assets = [
    ["target/release/gitforge", "usr/bin/gitforge", "755"],
    ["../../packaging/dev.gitforge.GitForge.desktop", "usr/share/applications/dev.gitforge.GitForge.desktop", "644"],
    ["../../assets/icons/hicolor/*/apps/dev.gitforge.GitForge.png", "usr/share/icons/hicolor/", "644"],
    ["../../assets/themes/*.json", "usr/share/gitforge/themes/", "644"],
]

# cargo-release: keep version examples in the workspace README in sync. Scoped to
# this crate (not release.toml) so the replacement runs once, not per crate.
# `file` resolves relative to this manifest dir -> ../../README.md = workspace root.
# The optional `(-[0-9A-Za-z.]+)?` tail matches prerelease suffixes (rc.1, alpha.2)
# so an rc->final or rc.1->rc.2 bump doesn't leave a stale suffix dangling. The
# class excludes `-` so it can't run past the arch separator in GitForge-{ver}-{arch}.
[package.metadata.release]
pre-release-replacements = [
    { file = "../../README.md", search = "GitForge-[0-9]+\\.[0-9]+\\.[0-9]+(-[0-9A-Za-z.]+)?",                  replace = "GitForge-{{version}}" },
    { file = "../../README.md", search = "v[0-9]+\\.[0-9]+\\.[0-9]+(-[0-9A-Za-z.]+)?",                          replace = "v{{version}}" },
    { file = "../../README.md", search = "build-update-tarball\\.sh [0-9]+\\.[0-9]+\\.[0-9]+(-[0-9A-Za-z.]+)?", replace = "build-update-tarball.sh {{version}}" },
]

[dependencies]
gitforge-ui = { path = "../gitforge-ui" }
gitforge-git = { path = "../gitforge-git" }
gitforge-graph = { path = "../gitforge-graph" }
gitforge-diff = { path = "../gitforge-diff" }
gitforge-syntax = { path = "../gitforge-syntax" }
gitforge-hosting = { path = "../gitforge-hosting" }
gitforge-ai = { path = "../gitforge-ai" }
gitforge-update = { path = "../gitforge-update" }
gpui.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
parking_lot.workspace = true
chrono.workspace = true
serde.workspace = true
serde_json.workspace = true
dirs.workspace = true
rfd = "0.15"
anyhow.workspace = true
