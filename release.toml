# cargo-release configuration.
#
# Install:  cargo install cargo-release
# Dry run:  cargo release patch --dry-run
# Execute:  cargo release patch -x          (level: patch | minor | major)
#
# Pre-release example: cargo release 0.2.0-rc.1 -x

# One commit for the whole workspace bump (the shared [workspace.package] version
# inherited by every crate via `version.workspace = true`).
consolidate-commits = true

# This is an app, not crates.io libraries — never run `cargo publish`.
publish = false

# Tags like v0.1.4 to match existing tag history (v0.1.0..v0.1.3). cargo-release
# always inserts a `v` before the version; the default subdirectory prefix would
# make per-package tags (gitforge-{name}-v0.1.4). Setting tag-prefix to "" clears
# that prefix so all workspace members share one consolidated root-level tag.
tag-prefix = ""

# NOTE: pre-release-replacements live in crates/gitforge-app/Cargo.toml under
# [package.metadata.release], not here. cargo-release applies release.toml's
# replacements once per workspace member (resolving `file` relative to each
# crate dir), which would look for crates/*/README.md. Scoping them to the
# single binary crate and pointing at ../../README.md applies them exactly once
# against the workspace README.
