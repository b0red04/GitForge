name: Release

# Disabled automatic runs — trigger manually from Actions → Release → Run workflow.
on:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libssl-dev \
            libfreetype-dev \
            libfontconfig-dev \
            libwayland-dev \
            libx11-dev \
            libegl-dev \
            libvulkan-dev \
            libclang-dev \
            pkg-config

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build -p gitforge-app --release

      - name: Build update tarball
        run: bash scripts/build-update-tarball.sh

      - name: Compute checksums
        run: |
          cd target/release
          sha256sum gitforge > gitforge.sha256

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            target/release/gitforge
            target/release/gitforge.sha256
            GitForge-*.tar.gz
            GitForge-*.tar.gz.sha256
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref, '-rc') || contains(github.ref, '-beta') || contains(github.ref, '-alpha') }}
