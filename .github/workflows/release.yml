name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Verify tag matches Cargo.toml version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          CARGO_VERSION="$(grep '^version' Cargo.toml | head -1 | cut -d'"' -f2)"
          if [ "${TAG_VERSION}" != "${CARGO_VERSION}" ]; then
            echo "Tag version (${TAG_VERSION}) does not match Cargo.toml (${CARGO_VERSION})" >&2
            exit 1
          fi

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libssl-dev \
            libfreetype-dev \
            libfontconfig-dev \
            libwayland-dev \
            libx11-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libegl-dev \
            libvulkan-dev \
            libclang-dev \
            pkg-config

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build -p gitforge-app --release

      - name: Build update tarball
        run: bash scripts/build-update-tarball.sh "${GITHUB_REF_NAME#v}"

      - name: Compute checksums
        run: |
          cd target/release
          sha256sum gitforge > gitforge.sha256

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            target/release/gitforge
            target/release/gitforge.sha256
            GitForge-*.tar.gz
            GitForge-*.tar.gz.sha256
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-rc') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-alpha') }}
